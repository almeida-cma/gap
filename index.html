<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 Biblioteca Híbrida — Câmera, GPS, WhatsApp, SMS</title>
    <style>
        /* ============================================================
           RESET E CSS BASE
           ============================================================ */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
        }

        /* ============================================================
           BOTÃO VOLTAR AO TOPO (FAB)
           ============================================================ */
        .btn-topo {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(168,85,247,0.5);
            transition: all 0.25s;
            z-index: 1500;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-topo:hover {
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 12px 28px rgba(168,85,247,0.65);
        }
        .btn-topo.oculto {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.5);
        }

        /* ============================================================
           SIDEBAR
           ============================================================ */
        .sidebar {
            width: 300px;
            background: #1e293b;
            padding: 20px 14px;
            height: 100vh;
            overflow-y: auto;
            position: fixed;
            left: 0;
            top: 0;
            border-right: 1px solid #334155;
            z-index: 100;
            transition: transform 0.3s;
        }

        .sidebar-logo {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        .sidebar-sub {
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        .categoria-titulo {
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            color: #64748b;
            letter-spacing: 1.5px;
            margin: 18px 0 8px;
            padding-left: 8px;
            border-left: 3px solid #a855f7;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            margin: 2px 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            color: #cbd5e1;
            transition: all 0.15s;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        .sidebar-item:hover {
            background: #334155;
            color: white;
        }

        .sidebar-item.ativo {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            font-weight: 700;
        }

        .sidebar-item .icone { font-size: 1rem; }

        /* ============================================================
           CONTEÚDO PRINCIPAL
           ============================================================ */
        .main {
            margin-left: 300px;
            flex: 1;
            padding: 26px 30px;
            min-height: 100vh;
            scroll-behavior: smooth;
        }

        .main-header h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        .main-header p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .main-header .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .meta-badge {
            background: #334155;
            color: #cbd5e1;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
        }

        .meta-badge.responsive {
            background: #065f46;
            color: #86efac;
        }

        .meta-badge.categoria {
            background: #7c3aed;
            color: white;
        }

        .meta-badge.mobile {
            background: #0369a1;
            color: #7dd3fc;
        }

        /* ============================================================
           PREVIEW
           ============================================================ */
        .preview-wrapper {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .preview-header {
            background: #1e293b;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .preview-header .ponto {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 4px;
        }

        .ponto.vermelho { background: #ef4444; }
        .ponto.amarelo { background: #f59e0b; }
        .ponto.verde { background: #10b981; }

        .preview-titulo {
            color: #94a3b8;
            font-size: 0.75rem;
            font-family: monospace;
        }

        .preview-iframe {
            width: 100%;
            height: 560px;
            border: none;
            background: white;
            display: block;
        }

        /* ============================================================
           BOTÃO ABRIR EM NOVA ABA
           ============================================================ */
        .btn-nova-aba {
            display: inline-block;
            padding: 10px 20px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 20px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: 0.15s;
        }
        .btn-nova-aba:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16,185,129,0.4);
        }

        /* ============================================================
           ABAS
           ============================================================ */
        .abas {
            display: flex;
            gap: 4px;
            margin-bottom: 0;
            border-bottom: 2px solid #334155;
            flex-wrap: wrap;
        }

        .aba {
            padding: 10px 18px;
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.15s;
            font-family: inherit;
        }

        .aba:hover { color: #cbd5e1; background: #1e293b; }
        .aba.ativa { color: #a855f7; border-bottom-color: #a855f7; }

        .bloco-codigo {
            display: none;
            position: relative;
            background: #020617;
            border-radius: 0 0 12px 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .bloco-codigo.ativo { display: block; }

        .bloco-codigo .btn-copiar {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #10b981;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 700;
            font-family: inherit;
            z-index: 2;
        }

        .bloco-codigo .btn-copiar:hover { background: #059669; }

        .bloco-codigo pre {
            padding: 18px 20px;
            color: #e2e8f0;
            font-family: 'Courier New', monospace;
            font-size: 0.78rem;
            line-height: 1.7;
            overflow-x: auto;
            white-space: pre;
            max-height: 460px;
        }

        /* ============================================================
           INFO BOX
           ============================================================ */
        .info-box {
            background: #1e293b;
            border-left: 4px solid #a855f7;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 20px;
            font-size: 0.88rem;
            line-height: 1.7;
        }

        .info-box strong { color: #c084fc; }
        .info-box code {
            background: #334155;
            color: #fbbf24;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.82rem;
        }

        .info-box.aviso {
            background: #422006;
            border-left-color: #f59e0b;
            color: #fde68a;
        }
        .info-box.aviso strong { color: #fbbf24; }

        /* ============================================================
           BOTÃO MENU MOBILE
           ============================================================ */
        .btn-menu-mobile {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 200;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
        }

        /* ============================================================
           RESPONSIVO
           ============================================================ */
        @media (max-width: 900px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.aberta { transform: translateX(0); }
            .main { margin-left: 0; padding: 70px 16px 26px; }
            .btn-menu-mobile { display: block; }
            .main-header h1 { font-size: 1.4rem; }
            .preview-iframe { height: 480px; }
        }
    </style>
</head>

            js: `let ultimaFoto = null;

function processarFoto(input) {
    const arquivo = input.files[0];
    if (!arquivo) return;

    if (!arquivo.type.startsWith("image/")) {
        alert("O arquivo selecionado não é uma imagem.");
        return;
    }

    const leitor = new FileReader();
    leitor.onload = function(e) {
        ultimaFoto = e.target.result;
        document.getElementById("previewFoto").innerHTML =
            '<img src="' + ultimaFoto + '" alt="Foto capturada">';
        document.getElementById("acoesCamera").style.display = "flex";
    };
    leitor.readAsDataURL(arquivo);
}

function baixarFoto() {
    if (!ultimaFoto) return;
    const a = document.createElement("a");
    a.href = ultimaFoto;
    a.download = "foto-" + Date.now() + ".jpg";
    a.click();
}

function limparFoto() {
    ultimaFoto = null;
    document.getElementById("previewFoto").innerHTML =
        "<span>Nenhuma foto capturada ainda</span>";
    document.getElementById("acoesCamera").style.display = "none";
    document.querySelectorAll('input[type="file"]').forEach(i => i.value = "");
}`

            js: `let coordsAtuais = null;

function obterLocalizacao() {
    const btn = document.getElementById("btnGeo");
    const res = document.getElementById("geoResultado");
    const acoes = document.getElementById("acoesGeo");

    if (!navigator.geolocation) {
        res.innerHTML = '<span style="color:#ef4444;">❌ Geolocalização não suportada</span>';
        return;
    }

    btn.disabled = true;
    btn.innerText = "⏳ Obtendo...";
    res.innerHTML = '<span class="vazio">Aguardando permissão do GPS...</span>';

    navigator.geolocation.getCurrentPosition(
        function(pos) {
            coordsAtuais = {
                lat: pos.coords.latitude.toFixed(6),
                lon: pos.coords.longitude.toFixed(6),
                acc: pos.coords.accuracy.toFixed(0)
            };
            res.innerHTML =
                '<div class="linha"><strong>Latitude:</strong> ' + coordsAtuais.lat + '</div>' +
                '<div class="linha"><strong>Longitude:</strong> ' + coordsAtuais.lon + '</div>' +
                '<div class="linha"><strong>Precisão:</strong> ±' + coordsAtuais.acc + ' metros</div>';

            document.getElementById("btnMapa").href =
                "https://www.google.com/maps?q=" + coordsAtuais.lat + "," + coordsAtuais.lon;
            acoes.style.display = "flex";

            btn.disabled = false;
            btn.innerText = "📡 Atualizar Localização";
        },
        function(erro) {
            let msg = "Erro desconhecido.";
            if (erro.code === 1) msg = "Permissão negada pelo usuário.";
            if (erro.code === 2) msg = "Posição indisponível.";
            if (erro.code === 3) msg = "Tempo esgotado.";
            res.innerHTML = '<span style="color:#ef4444;">❌ ' + msg + '</span>';
            btn.disabled = false;
            btn.innerText = "📡 Tentar Novamente";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
}

function copiarCoords() {
    if (!coordsAtuais) return;
    const texto = coordsAtuais.lat + ", " + coordsAtuais.lon;
    navigator.clipboard.writeText(texto).then(() => {
        alert("📋 Coordenadas copiadas!");
    });
}`

            js: `function calcularDistancia() {
    const latA = parseFloat(document.getElementById("latA").value);
    const lonA = parseFloat(document.getElementById("lonA").value);
    const latB = parseFloat(document.getElementById("latB").value);
    const lonB = parseFloat(document.getElementById("lonB").value);
    const res = document.getElementById("resultadoDist");

    if ([latA, lonA, latB, lonB].some(v => isNaN(v))) {
        res.innerHTML = '<span style="color:#ef4444;">❌ Preencha todas as coordenadas</span>';
        return;
    }

    const R = 6371;
    const dLat = (latB - latA) * Math.PI / 180;
    const dLon = (lonB - lonA) * Math.PI / 180;
    const a = Math.sin(dLat/2) ** 2 +
              Math.cos(latA * Math.PI/180) * Math.cos(latB * Math.PI/180) *
              Math.sin(dLon/2) ** 2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    const d = R * c;

    res.innerHTML =
        "📏 Distância: <strong>" + d.toFixed(2) + " km</strong>" +
        "<br><small style='font-weight:400; color:#7c3aed;'>" +
        d.toFixed(0) + " metros</small>";
}

function usarMinhaLocalizacao() {
    if (!navigator.geolocation) {
        alert("Geolocalização não suportada.");
        return;
    }
    navigator.geolocation.getCurrentPosition(
        function(pos) {
            document.getElementById("latA").value = pos.coords.latitude.toFixed(6);
            document.getElementById("lonA").value = pos.coords.longitude.toFixed(6);
            calcularDistancia();
        },
        function() {
            alert("Não foi possível obter sua localização.");
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}`

    /* ============================================================

    const categorias = [...new Set(COMPONENTES.map(c => c.categoria))];
    const sidebarNav = document.getElementById('sidebarNav');

    categorias.forEach(cat => {
        const titulo = document.createElement('div');
        titulo.className = 'categoria-titulo';
        titulo.textContent = cat;
        sidebarNav.appendChild(titulo);

        COMPONENTES.filter(c => c.categoria === cat).forEach(comp => {
            const btn = document.createElement('button');
            btn.className = 'sidebar-item';
            btn.dataset.id = comp.id;
            btn.innerHTML = `<span class="icone">${comp.icone}</span> ${comp.nome}`;
            btn.onclick = () => mostrarComponente(comp.id);
            sidebarNav.appendChild(btn);
        });
    });

    /* ============================================================
       RENDERIZAR COMPONENTE
       ============================================================ */
    const conteudoPrincipal = document.getElementById('conteudoPrincipal');
    let htmlCompletoAtual = '';

    function mostrarComponente(id) {
        const comp = COMPONENTES.find(c => c.id === id);
        if (!comp) return;

        document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('ativo'));
        const btnAtivo = document.querySelector(`.sidebar-item[data-id="${id}"]`);
        if (btnAtivo) btnAtivo.classList.add('ativo');

        document.getElementById('sidebar').classList.remove('aberta');

        const htmlCompleto = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${comp.nome}</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #1e293b; padding: 16px; }
${comp.css}
</style>
</head>
<body>
${comp.html}
<script>
${comp.js}
<\/script>
</body>
</html>`;

        htmlCompletoAtual = htmlCompleto;

        conteudoPrincipal.innerHTML = `
            <div class="main-header">
                <h1>${comp.icone} ${comp.nome}</h1>
                <p>Componente híbrido funcional para mobile. Edite os campos no preview ou copie o código.</p>
                <div class="meta">
                    <span class="meta-badge categoria">${comp.categoria}</span>
                    <span class="meta-badge responsive">📱 Responsivo</span>
                    <span class="meta-badge mobile">📲 Mobile First</span>
                    <span class="meta-badge">📄 HTML5</span>
                    <span class="meta-badge">🎨 CSS3</span>
                    <span class="meta-badge">⚙️ JS Vanilla</span>
                </div>
            </div>

            <div class="info-box">
                💡 <strong>Dica de Implementação:</strong> ${comp.dicas}
            </div>

            <div class="info-box aviso">
                ⚠️ <strong>Importante:</strong> Câmera (input file), WhatsApp e SMS funcionam sem HTTPS. Já <strong>GPS</strong> e <strong>Web Share API</strong> exigem <strong>HTTPS</strong> ou <strong>localhost</strong>. Para testar tudo no celular, use Netlify Drop, GitHub Pages ou ngrok.
            </div>

            <button class="btn-nova-aba" onclick="abrirEmNovaAba()">
                🚀 Abrir este componente em Nova Aba (testar no celular)
            </button>

            <div class="preview-wrapper">
                <div class="preview-header">
                    <div>
                        <span class="ponto vermelho"></span>
                        <span class="ponto amarelo"></span>
                        <span class="ponto verde"></span>
                    </div>
                    <span class="preview-titulo">preview-${comp.id}.html</span>
                    <span style="width:40px;"></span>
                </div>
                <iframe class="preview-iframe" id="previewIframe" allow="camera; microphone; geolocation"></iframe>
            </div>

            <div class="abas">
                <button class="aba ativa" onclick="trocarAba(this, 'html')">📄 HTML</button>
                <button class="aba" onclick="trocarAba(this, 'css')">🎨 CSS</button>
                <button class="aba" onclick="trocarAba(this, 'js')">⚙️ JS</button>
                <button class="aba" onclick="trocarAba(this, 'tudo')">📦 Código Completo</button>
            </div>

            <div class="bloco-codigo ativo" id="aba-html">
                <button class="btn-copiar" onclick="copiarAba('aba-html', this)">📋 Copiar HTML</button>
                <pre>${escapeHtml(comp.html)}</pre>
            </div>
            <div class="bloco-codigo" id="aba-css">
                <button class="btn-copiar" onclick="copiarAba('aba-css', this)">📋 Copiar CSS</button>
                <pre>${escapeHtml(comp.css)}</pre>
            </div>
            <div class="bloco-codigo" id="aba-js">
                <button class="btn-copiar" onclick="copiarAba('aba-js', this)">📋 Copiar JS</button>
                <pre>${escapeHtml(comp.js)}</pre>
            </div>
            <div class="bloco-codigo" id="aba-tudo">
                <button class="btn-copiar" onclick="copiarAba('aba-tudo', this)">📋 Copiar Tudo</button>
                <pre>${escapeHtml(htmlCompleto)}</pre>
            </div>
        `;

        const iframe = document.getElementById('previewIframe');
        iframe.srcdoc = htmlCompleto;

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ============================================================
       ABRIR EM NOVA ABA
       ============================================================ */
    function abrirEmNovaAba() {
        const blob = new Blob([htmlCompletoAtual], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
    }

    /* ============================================================
       ABAS DE CÓDIGO
       ============================================================ */
    function trocarAba(btn, tipo) {
        document.querySelectorAll('.aba').forEach(b => b.classList.remove('ativa'));
        document.querySelectorAll('.bloco-codigo').forEach(b => b.classList.remove('ativo'));
        btn.classList.add('ativa');
        document.getElementById('aba-' + tipo).classList.add('ativo');
    }

    function copiarAba(idAba, btn) {
        const texto = document.getElementById(idAba).querySelector('pre').innerText;
        navigator.clipboard.writeText(texto).then(() => {
            const orig = btn.textContent;
            btn.textContent = '✅ Copiado!';
            setTimeout(() => btn.textContent = orig, 1800);
        });
    }

    function escapeHtml(txt) {
        return txt
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    /* ============================================================
       MENU MOBILE
       ============================================================ */
    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('aberta');
    }

    function voltarAoInicioPrincipal() {
        document.getElementById('inicioPrincipal').scrollIntoView({
            behavior: 'smooth',
            block: 'start'
        });
    }

    window.addEventListener('scroll', () => {
        const btn = document.getElementById('btnTopo');
        if (window.scrollY > 350) {
            btn.classList.remove('oculto');
        } else {
            btn.classList.add('oculto');
        }
    });

    /* INICIAR */
    mostrarComponente(COMPONENTES[0].id);
</script>

</body>
</html>
